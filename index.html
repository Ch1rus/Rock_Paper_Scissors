  <script>
    
    
    // function getComputerChoice: returns ("rock, paper, scissors")

    function getComputerChoice(rps){
         rps = Math.random()
        if ( rps <= 1/3) return ("rock");
        else if (rps <=2/3) return ("paper")
        else return ("scissors");
    }

    

    // function getHumanChoice

    function getHumanChoice(){
      let hrps = prompt("Choose you pick: Rock, Paper or Scissors!");
      return hrps.toLowerCase()
    } 

   
  

   let humanScore = 0
   let computerScore = 0

   function playRound(humanChoice,computerChoice){
    humanChoice = getHumanChoice();
    computerChoice = getComputerChoice();
    console.log("You chose", humanChoice)
    console.log("Computer chose", computerChoice)
    if (humanChoice === computerChoice){++humanScore; ++computerScore; return "It's a tie"}
    else if (humanChoice === "rock" && computerChoice === "paper"){ ++computerScore; return "You Lose, Paper beats Rock"}
    else if (humanChoice === "rock" && computerChoice === "scissors"){ ++humanScore; return("You Win, Rock beats Scissors")}
    else if (humanChoice === "paper" && computerChoice === "rock"){ ++humanScore; return("You Win, Paper beats Rock")}
    else if (humanChoice === "paper" && computerChoice === "scissors"){ ++computerScore; return("You Lose, Scissors beats Paper")}
    else if (humanChoice === "scissors" && computerChoice === "rock"){++computerScore; return("You Lose, Rock beats Scissors")}
    else if (humanChoice === "scissors" && computerChoice === "paper"){++humanScore; return("You win, Scissors beats Paper")}  
    
   }

   // first all winning then all losing, no, every pair first
   
   
   
   function playGame(){
   console.log(playRound()); console.log("Your Score is:", humanScore, "Computer Score is:", computerScore);
   console.log(playRound()); console.log("Your Score is:", humanScore, "Computer Score is:", computerScore);
   console.log(playRound()); console.log("Your Score is:", humanScore, "Computer Score is:", computerScore);
   console.log(playRound()); console.log("Your Score is:", humanScore, "Computer Score is:", computerScore);
   console.log(playRound()); console.log("Your Score is:", humanScore, "Computer Score is:", computerScore)

   }
  playGame()
   
   let finalScore = function(humanChoice,computerChoice){
    if (humanChoice > computerChoice){return "You win the game yey!"}
    else if (humanChoice < computerChoice){return "Sadly You lost the GAME"}
    else if (humanChoice === computerChoice) {return "It's a tie, you can try again by pressing F5!"}
   }
